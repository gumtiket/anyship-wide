[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anyship-adapters"
version = "0.1.0"
description = "배포 어댑터: 서비스가 호출하는 인터페이스, mock, 환경별 실제 어댑터"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
# AWS를 호출하는 기능(Route 53 등). 서비스는 boto3를 이미 고정해서 쓰고 있다.
aws = ["boto3>=1.34"]
test = ["pytest>=8", "pyyaml>=6", "boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["."]
include = ["anyship_adapters", "anyship_adapters.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../ruff.toml"
