[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github"
version = "0.1.0"
description = "Reusable GitHub repository operations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "python-dotenv>=1"]
web = [
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
    "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "cryptography>=43",
    "psycopg[binary]>=3.2,<4", "python-dotenv>=1", "boto3>=1.35,<2", "pyyaml>=6,<7",
    "anyship-adapters==0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["github", "github.*", "app", "app.*"]

[tool.setuptools.package-data]
github = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../ruff.toml"
